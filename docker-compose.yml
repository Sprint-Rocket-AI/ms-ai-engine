services:
  # utilizado por ms-ai-engine para almacenar embeddings.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-engine-pgvector
    environment:
      POSTGRES_DB: ai_engine
      POSTGRES_USER: ai_engine
      POSTGRES_PASSWORD: ai_engine
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_engine -d ai_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # utilizado por ms-ai-engine para almacenar embeddings en cache (semantic-cache)
  redis-vector:
    image: redis/redis-stack:latest
    container_name: springrocket-redis-vector
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: springrocket-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: mydatabase
    volumes:
      - mongodb_data:/data/db
      - ../ms-checkpoint/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
  redis_data:
  mongodb_data:
