version: "3.9"

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-engine-pgvector
    environment:
      POSTGRES_DB: ai_engine
      POSTGRES_USER: ai_engine
      POSTGRES_PASSWORD: ai_engine
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data:

