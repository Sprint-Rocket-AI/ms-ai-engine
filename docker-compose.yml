services:
  # utilizado por ms-ai-engine para almacenar embeddings.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: ai-engine-pgvector
    environment:
      POSTGRES_DB: ai_engine
      POSTGRES_USER: ai_engine
      POSTGRES_PASSWORD: ai_engine
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_engine -d ai_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # utilizado por ms-ai-engine para almacenar embeddings en cache (semantic-cache)
  redis-vector:
    image: redis/redis-stack:latest
    container_name: springrocket-redis-vector
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
  redis_data:
