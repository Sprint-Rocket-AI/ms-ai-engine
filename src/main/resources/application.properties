spring.application.name=ms-ai-engine
server.port=8080
server.servlet.context-path=/ai-engine

# Configuracion de Spring AI para Google GenAI (Chat)
spring.ai.google.genai.api-key=${API_KEY:AIzaSyDVNGbU66gjtHvwLA4WIF-00hmXQQBrp5I}
spring.ai.google.genai.project-id=${PROJECT_ID:1024049569622}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Configuracion de Spring AI para Google GenAI (Embedding)
spring.ai.google.genai.embedding.api-key=${API_KEY}
spring.ai.google.genai.embedding.project-id=${PROJECT_ID}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# Postgres datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_engine
spring.datasource.username=ai_engine
spring.datasource.password=ai_engine
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring AI PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.table-name=ai_embeddings
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.id-type=TEXT
