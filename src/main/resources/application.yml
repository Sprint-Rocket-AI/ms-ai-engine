spring:
  application:
    name: ms-ai-engine
  ai:
#    anthropic:
#      api-key: ${ANTHROPIC_API_KEY}
#      chat:
#        options:
#          model: claude-sonnet-4-5
#          temperature: 0.7
#          max-tokens: 5000
#
#    google:
#      genai:
#        embedding:
#          api-key: ${API_KEY}
#          project-id: ${PROJECT_ID}
#          text:
#            options:
#              model: gemini-embedding-001
#              dimensions: 768
#        chat:
#          enabled: false
    ollama:
      base-url: http://localhost:11434
      init:
        timeout: 5m
      chat:
        options:
          model: qwen2.5:7b
      embedding:
        options:
          model: qwen3-embedding:0.6b
          dimensions: 1024

    mcp:
      client:
        enabled: true
        initialized: false
        sse:
          connections:
            ms-checkpoint:
              url: http://localhost:8082/sse

#        streamable-http:
#          connections:
#            github-mcp:
#              url: https://api.githubcopilot.com/mcp/
#              headers:
#                Authorization: Bearer ${GITHUB_MCP_TOKEN}
#

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_engine
    username: ai_engine
    password: ai_engine
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
        uri: ${MONGODB_URI}
        database: ${MONGODB_DATABASE}

    redis:
      host: localhost
      port: 6379
      timeout: 60000


server:
  port: 8080
  servlet:
    context-path: /ai-engine

semantic:
  cache:
    similarity-threshold: 0.95
    ttl-seconds: 3600
    index: "cache-index"
    prefix: "cache:"

logging:
  level:
    org.springframework.ai.mcp: DEBUG
    io.modelcontextprotocol: DEBUG
cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}